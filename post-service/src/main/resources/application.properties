spring.application.name=post-service
server.port=8084

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/post_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

security.jwt.secret=${JWT_SECRET}
security.jwt.secret-base64=${JWT_SECRET_BASE64:false}

# Media Service discovery name and upload limits.
app.media.service-id=${MEDIA_SERVICE_ID:media-service}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never