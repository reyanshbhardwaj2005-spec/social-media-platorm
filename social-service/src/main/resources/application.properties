spring.application.name=social-service
server.port=8085

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/social_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

security.jwt.secret=${JWT_SECRET}
security.jwt.secret-base64=${JWT_SECRET_BASE64:false}

# Configure these paths to match the actual endpoints in your services.
app.clients.user-service-url=${USER_SERVICE_URL:http://localhost:8082}
app.clients.user-exists-path=${USER_EXISTS_PATH:/api/v1/users/{userId}/exists}
app.clients.post-service-url=${POST_SERVICE_URL:http://localhost:8084}
app.clients.post-exists-path=${POST_EXISTS_PATH:/api/v1/posts/{postId}/exists}
app.clients.post-feed-path=${POST_FEED_PATH:/api/v1/posts/feed}
app.clients.connect-timeout-ms=3000
app.clients.read-timeout-ms=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}