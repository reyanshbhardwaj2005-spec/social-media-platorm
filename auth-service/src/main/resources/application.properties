spring.application.name=auth-service
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#JWT Services
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${ACCESS_TOKEN_EXP}
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXP}

# Register OAuth providers in the provider console and set these environment variables.
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:8080/oauth2/callback}

logging.level.org.springframework.security=INFO

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}