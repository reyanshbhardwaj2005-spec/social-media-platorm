spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Spring Cloud Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.server.webmvc.enabled=true

# Logging
# logging.level.org.springframework.cloud.netflix.eureka=INFO

# Swagger UI configuration

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/user/v3/api-docs

springdoc.swagger-ui.urls[2].name=Media Service
springdoc.swagger-ui.urls[2].url=/media/v3/api-docs

springdoc.swagger-ui.urls[3].name=Post Service
springdoc.swagger-ui.urls[3].url=/post/v3/api-docs

springdoc.swagger-ui.urls[4].name=Social Service
springdoc.swagger-ui.urls[4].url=/social/v3/api-docs

springdoc.swagger-ui.urls-primary-name=Auth Service